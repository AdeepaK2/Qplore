# Optional: run the QPlore app in Docker instead of `npm run start:app`.
#   docker compose up        -> http://localhost:8080
# Data lives in memory: restarting the container (or POST /api/test/reset) restores the seed data.
services:
  qplore:
    image: node:20-alpine
    container_name: qplore-app
    working_dir: /app
    command: sh -c "npm install --omit=dev --no-audit --no-fund && npm run start:app"
    environment:
      CYPRESS_INSTALL_BINARY: "0"
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - /app/node_modules   # keep the container's node_modules separate from Windows'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
